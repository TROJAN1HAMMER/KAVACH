services:
  postgres:
    # pgvector/pgvector:pg16 is upstream Postgres 16 plus the pgvector
    # extension pre-built in — same POSTGRES_*/data volume as the plain
    # postgres:16-alpine image this replaces, so existing data keeps
    # working unmodified; only `CREATE EXTENSION vector` (done in
    # migration 0011) is new. Needed for the knowledge base's embedding
    # search (app/services/knowledge_base/vector_store.py).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kavach
      POSTGRES_PASSWORD: kavach_secret
      POSTGRES_DB: kavach_db
    ports:
      - "5432:5432"
    volumes:
      - kavach_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kavach -d kavach_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kavach:kavach_secret@postgres:5432/kavach_db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
      # Only the uploaded-documents subdirectory is host-mounted, not all
      # of /app/data — data/fastembed_cache holds the embedding model
      # pre-downloaded into the image at build time (see Dockerfile), and
      # mounting the whole data/ directory would shadow it with an empty
      # host folder, forcing a live Hugging Face download on every
      # container recreation (defeating the entire "no internet needed at
      # runtime" point of pre-baking it).
      - ./data/knowledge_base:/app/data/knowledge_base

  # Static SPA build — see frontend/Dockerfile. VITE_API_URL is baked in
  # at *build* time (Vite can't read env vars at container startup), so it
  # must be wherever the browser itself can reach the API — the host's
  # published 8000 port, not the in-network "api" hostname the other
  # services here use.
  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:8080"
    depends_on:
      - api

  # Dedicated, always-on capacity for critical/high priority scans — kept
  # separate from worker-default so a backlog of low-priority scans can
  # never starve them (see app/workers/celery_app.py's QUEUE_BY_PRIORITY).
  worker-critical:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kavach:kavach_secret@postgres:5432/kavach_db
      REDIS_URL: redis://redis:6379/0
    command: >
      celery -A celery_worker.celery_app worker
      --loglevel=info
      --queues=kavach.critical,kavach.high
      --concurrency=4
      --hostname=critical@%h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports

  # Bulk-throughput pool for normal/low priority scans. Scale this one for
  # the "1000+ simultaneous repositories" requirement, e.g.:
  #   docker-compose up --scale worker-default=10
  worker-default:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kavach:kavach_secret@postgres:5432/kavach_db
      REDIS_URL: redis://redis:6379/0
    command: >
      celery -A celery_worker.celery_app worker
      --loglevel=info
      --queues=kavach.normal,kavach.low
      --concurrency=8
      --hostname=default@%h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
      # Only the uploaded-documents subdirectory is host-mounted, not all
      # of /app/data — data/fastembed_cache holds the embedding model
      # pre-downloaded into the image at build time (see Dockerfile), and
      # mounting the whole data/ directory would shadow it with an empty
      # host folder, forcing a live Hugging Face download on every
      # container recreation (defeating the entire "no internet needed at
      # runtime" point of pre-baking it).
      - ./data/knowledge_base:/app/data/knowledge_base

  # Single scheduler process for the periodic stalled-job sweeper — unlike
  # workers, Celery Beat must never run more than one instance at a time.
  beat:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kavach:kavach_secret@postgres:5432/kavach_db
      REDIS_URL: redis://redis:6379/0
    command: celery -A celery_worker.celery_app beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Worker/task monitoring UI — this is the standard way to see live
  # worker heartbeats, active/queued task counts per queue, and task
  # history, rather than building a custom equivalent.
  flower:
    image: mher/flower:2.0
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  kavach_postgres_data:
