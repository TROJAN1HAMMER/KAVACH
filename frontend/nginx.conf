server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Kubernetes liveness/readiness target — nginx itself being up to
    # answer this is a sufficient check for a static SPA (there's no
    # downstream dependency for a static file server to be "not ready" for).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback: any path that isn't a real static file falls back to
    # index.html so client-side routing (react-router or similar) can
    # handle it — without this, a hard refresh on any non-root path 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
