name: kavach_mobile
description: KAVACH — AI-Powered DevSecOps for Banking. Mobile client for the KAVACH platform.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.6.2

  # Secure token persistence
  flutter_secure_storage: ^9.2.2

  # Typed models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Charts (Risk Dashboard, Executive Summary)
  fl_chart: ^0.69.2

  # Lightweight motion (splash / empty states) — used sparingly per KAVACH's
  # "no excessive animation" visual guideline.
  lottie: ^3.1.3

  # Remote images (avatars, provider logos)
  cached_network_image: ^3.4.1

  # Date/number formatting
  intl: ^0.19.0

  # Opening external links (repo URLs, docs)
  url_launcher: ^6.3.1

  # ZIP upload for "Start Scan"
  file_picker: 11.0.2

  # Storage / notification runtime permissions
  permission_handler: ^11.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/images/
